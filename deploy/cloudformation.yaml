AWSTemplateFormatVersion: '2010-09-09'
Description: Taskboard demo - one Amazon Linux 2023 EC2 instance, Nginx, Flask and SQLite.

Parameters:
  GitHubRepository:
    Type: String
    Description: Public GitHub repository in OWNER/REPOSITORY format (no URL).
    AllowedPattern: '[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+'
  GitCommit:
    Type: String
    Description: Full 40-character commit SHA to deploy. Copy it from your GitHub commit page.
    AllowedPattern: '[a-fA-F0-9]{40}'
  InstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
    Description: Small x86_64 instance. Verify your account credits and regional price first.
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Official standard Amazon Linux 2023 x86_64 AMI from AWS.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-vpc'
  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.1.0/24
      MapPublicIpOnLaunch: true
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  SubnetRoute:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref PublicRouteTable
  WebSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public HTTP only. No inbound SSH or database port.
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: Public demo web traffic
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS package downloads and AWS management endpoints
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
          Description: HTTP package repositories if required
  ManagementRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore'
  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref ManagementRole
  WebServer:
    Type: AWS::EC2::Instance
    DependsOn:
      - InternetRoute
      - SubnetRoute
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT20M
    Properties:
      ImageId: !Ref LatestAmiId
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds:
        - !Ref WebSecurityGroup
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
        HttpPutResponseHopLimit: 1
      CreditSpecification:
        CPUCredits: standard
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs:
            VolumeType: gp3
            VolumeSize: 8
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-web'
        - Key: Project
          Value: MangoAppsTakeHome
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -Eeuo pipefail
          # Fail the stack if installation or the local readiness check fails.
          dnf install -y aws-cfn-bootstrap git
          trap '/opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource WebServer --region ${AWS::Region}' EXIT
          systemctl enable --now amazon-ssm-agent
          export GIT_TERMINAL_PROMPT=0
          git init /opt/mango-source
          cd /opt/mango-source
          git remote add origin 'https://github.com/${GitHubRepository}.git'
          git fetch --depth 1 origin '${GitCommit}'
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$(echo '${GitCommit}' | tr 'A-F' 'a-f')"
          bash deploy/provision.sh

Outputs:
  AppUrl:
    Description: Public app link. Use HTTP explicitly; this demo does not configure TLS.
    Value: !Sub 'http://${WebServer.PublicIp}'
  HealthUrl:
    Description: Readiness endpoint; checks the application database.
    Value: !Sub 'http://${WebServer.PublicIp}/health'
  InstanceId:
    Description: Select this EC2 instance and choose Connect, then Session Manager.
    Value: !Ref WebServer
